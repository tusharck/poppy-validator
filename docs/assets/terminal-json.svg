<text x="20" y="242"><tspan fill="#d7d7de">  </tspan><tspan fill="#5fc4d4">&quot;mode&quot;</tspan><tspan fill="#d7d7de">: </tspan><tspan fill="#8fcf7a">&quot;url&quot;</tspan><tspan fill="#d7d7de">,</tspan></text>
<text x="20" y="262"><tspan fill="#d7d7de">  </tspan><tspan fill="#5fc4d4">&quot;valid&quot;</tspan><tspan fill="#d7d7de">: </tspan><tspan fill="#e8c06c">false</tspan><tspan fill="#d7d7de">,</tspan></text>
<text x="20" y="282"><tspan fill="#d7d7de">  </tspan><tspan fill="#5fc4d4">&quot;complete&quot;</tspan><tspan fill="#d7d7de">: </tspan><tspan fill="#e8c06c">true</tspan><tspan fill="#d7d7de">,</tspan></text>
