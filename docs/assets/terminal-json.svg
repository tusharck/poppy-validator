<text x="20" y="182"><tspan fill="#d7d7de">    </tspan><tspan fill="#5fc4d4">&quot;status&quot;</tspan><tspan fill="#d7d7de">: </tspan><tspan fill="#8fcf7a">&quot;draft&quot;</tspan></text>
<text x="20" y="202"><tspan fill="#d7d7de">  },</tspan></text>
